name: Test

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Check shell scripts
        run: shellcheck install.sh zt-moon-endpoint-update tests/test-updater.sh
      - name: Run regression tests
        run: sudo tests/test-updater.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run diagnostic tests
        shell: pwsh
        run: .\tests\test-diagnose-zerotier-path.ps1
